[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docx2json"]
include-package-data = true

[project]
name = "docx2json"
version = "0.1.0"
description = "A tool to convert DOCX documents to JSON format"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
license = { file="LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "python-docx>=0.8.10",
  "unstructured>=0.5.0",
  "Pillow>=9.0.0",
]

[project.scripts]
docx2json = "docx2json.docx2json:main"